name: Sync All Navipilot Branches

on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = Beijing 02:00 next day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-navipilot-branches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Configure Git and upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git remote add upstream https://github.com/navipilot/openpilot.git
          git remote -v

      - name: Fetch all upstream branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune upstream '+refs/heads/*:refs/remotes/upstream/*'
          echo "Upstream branches:"
          git for-each-ref --format='%(refname)' refs/remotes/upstream/

      - name: Sync all branches and their Git LFS objects
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          count=0
          failed=0
          while IFS= read -r upstream_ref; do
            [ -n "$upstream_ref" ] || continue
            source_branch="${upstream_ref#refs/remotes/upstream/}"
            dest_branch="$source_branch"

            # Preserve the default branch that contains this scheduled workflow.
            if [ "$source_branch" = "master" ]; then
              dest_branch="navipilot/master"
            fi

            echo "::group::Sync $source_branch -> $dest_branch"
            echo "Fetching historical Git LFS objects..."
            if ! git lfs fetch --all upstream "$upstream_ref"; then
              echo "::error::LFS fetch failed for $source_branch; branch will not be updated"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi

            if ! git lfs push --all origin "$upstream_ref"; then
              echo "::error::LFS push failed for $source_branch; branch will not be updated"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi

            if ! git push --force origin "$upstream_ref:refs/heads/$dest_branch"; then
              echo "::error::Git push failed for $source_branch"
              failed=$((failed + 1))
            else
              count=$((count + 1))
              echo "Synced: $source_branch -> $dest_branch"
            fi
            echo "::endgroup::"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/upstream/)

          echo "Successfully synced branches: $count"
          echo "Failed branches: $failed"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Show remote branches
        if: always()
        shell: bash
        run: |
          git ls-remote --heads origin
