
name: Sync Branches

on:
  schedule:
    # 每天北京时间 02:00
    - cron: '0 18 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-branches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Validate Sync Token
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::Set the SYNC_TOKEN repository secret with Contents and Workflows write permissions (classic PAT: repo and workflow scopes)."
            exit 1
          fi

      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          lfs: false
          persist-credentials: true
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git lfs install --local

          git remote remove upstream 2>/dev/null || true
          git remote add upstream \
            https://github.com/navipilot/openpilot.git

      - name: Validate Repositories
        shell: bash
        env:
          TARGET_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$DEFAULT_BRANCH" != "master" ]]; then
            echo "::error::Default branch must be master"
            exit 1
          fi

          if [[ "$TARGET_REPO" == "navipilot/openpilot" ]]; then
            echo "::error::Source and target cannot be identical"
            exit 1
          fi

      - name: Fetch Source Branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune --no-tags upstream \
            '+refs/heads/*:refs/remotes/upstream/*'

          git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/upstream

      - name: Sync LFS Objects
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/upstream
          )

          for branch in "${branches[@]}"; do
            [[ "$branch" == "master" ]] && continue

            echo "Syncing LFS: $branch"

            fetch_log=$(mktemp)
            if ! git lfs fetch --all upstream \
              "refs/remotes/upstream/$branch" 2>&1 | tee "$fetch_log"; then
              # This upstream test fixture is a pointer to a public model, not an uploaded LFS object.
              fixture_oid=a086d5249fc308bb73993d1e64630c669d4c7df5bde85f42ad61902543648525
              if ! grep -Fq "[$fixture_oid] Object does not exist on the server: [404]" "$fetch_log"; then
                exit 1
              fi

              if ! git lfs fetch --all origin "refs/remotes/upstream/$branch"; then
                fixture=$(mktemp)
                trap 'rm -f "$fetch_log" "$fixture"' EXIT
                curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
                  --output "$fixture" \
                  https://github.com/happymaj11r/openpilot-models/releases/download/big-remove-avgpool-a086d524/big_driving_supercombo.onnx
                echo "$fixture_oid  $fixture" | sha256sum --check
                git lfs clean < "$fixture" > /dev/null
                rm -f "$fixture"
              fi
              git lfs fetch --all upstream "refs/remotes/upstream/$branch"
            fi
            rm -f "$fetch_log"

            git lfs push --all origin \
              "refs/remotes/upstream/$branch"
          done

      - name: Delete Target Branches Except Master
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            git ls-remote --heads origin |
              awk '{print $2}' |
              sed 's#^refs/heads/##'
          )

          for branch in "${branches[@]}"; do

            if [[ "$branch" == "master" ]]; then
              echo "Keeping master unchanged"
              continue
            fi

            echo "Deleting: $branch"

            git push origin \
              ":refs/heads/$branch"

          done

      - name: Recreate Source Branches Except Master
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/upstream
          )

          for branch in "${branches[@]}"; do

            [[ "$branch" == "master" ]] && continue

            source_ref="refs/remotes/upstream/$branch"
            target_ref="refs/heads/$branch"

            source_sha=$(git rev-parse "$source_ref")

            echo "Creating: $branch"

            git push origin \
              "$source_sha:$target_ref"

            target_sha=$(
              git ls-remote --heads origin "$target_ref" |
              awk '{print $1}'
            )

            if [[ "$source_sha" != "$target_sha" ]]; then
              echo "::error::Sync failed: $branch"
              exit 1
            fi

            echo "Synced: $branch"
          done

      - name: Verify Branches
        shell: bash
        run: |
          set -euo pipefail

          source_list=$(mktemp)
          target_list=$(mktemp)

          git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/upstream |
            grep -vx 'master' |
            sort > "$source_list"

          git ls-remote --heads origin |
            awk '{print $2}' |
            sed 's#^refs/heads/##' |
            grep -vx 'master' |
            sort > "$target_list"

          diff -u "$source_list" "$target_list"

          echo "All branches synchronized."

      - name: Show Final Result
        if: always()
        shell: bash
        run: |
          git ls-remote --heads origin
